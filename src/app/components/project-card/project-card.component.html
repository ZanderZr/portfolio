<div class="card">
  <i [class]="icon"></i>
  <span class="title">{{title}}</span>
  <p class="info">{{info}}</p>
  @if (actions.length) {
    <div class="share">
      @for (action of actions; track action.url) {
        <button (click)="run(action)" [class.secondary]="!$first">
          <p>{{ action.label }}</p>
          <i [class]="action.icon"></i>
        </button>
      }
    </div>
  }
</div>
